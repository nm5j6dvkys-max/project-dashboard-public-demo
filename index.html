<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb">
<meta name="description" content="从空白项目开始体验任务拆解、进度跟踪、风险管理与自动周报。数据仅保存在当前浏览器。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>项目协作台｜轻量化项目任务管理与进度跟踪系统</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script defer src="core.js"></script><script defer src="storage.js"></script><script defer src="script.js"></script>
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>
<aside id="sidebar" class="sidebar"></aside>
<div class="workspace">
<header class="topbar"><div class="breadcrumb"><button class="icon-button mobile-menu" data-action="sidebar" aria-label="展开导航">☰</button><span class="home-mark">⌂</span> 工作空间 <span class="separator">/</span><strong id="breadcrumb">项目总览</strong></div><div class="top-actions"><button class="icon-button" data-action="help" aria-label="使用帮助">?</button><span class="edition-label">在线体验版</span></div></header>
<main id="main" tabindex="-1">
<div class="page-heading"><div><h1 id="pageTitle">项目总览</h1><p id="pageSubtitle">每一步推进，都清晰可见。</p></div><div class="heading-actions"><button class="button primary" data-action="new-task">＋ 新增任务</button></div></div>
<section id="contextBar" class="context-bar" aria-label="统计时间与业务周期"></section>
<div id="storageWarning" class="notice danger" hidden></div>
<div id="content"></div>
<footer id="footer"></footer>
</main>
</div>
<dialog id="modal" aria-labelledby="modalTitle"><div id="modalContent"></div></dialog>
<div id="toast" role="status" class="toast" hidden></div>
<input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden>
<noscript>请启用 JavaScript 以使用项目协作台。数据仅存储在当前浏览器。</noscript>
</body>
</html>
